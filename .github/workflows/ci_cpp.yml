name: Pipeline

on:
  push:
    branches:
      - development

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Instalar dependências
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            g++ \
            cppcheck \

    - name: Analise
      run: |
          cppcheck cpp 

    - name: Compilar
      run: 
        g++ cpp/*.cpp 
        